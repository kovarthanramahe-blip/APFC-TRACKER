apply plugin: 'com.android.application'
// Phase 2 — first Kotlin code in this project (see variables.gradle's own Phase 2 comment and
// the root build.gradle's kotlin-gradle-plugin classpath entry).
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace = "com.apfctracker.app"
    compileSdk = rootProject.ext.compileSdkVersion
    // Phase 10 — pins the NDK used to build the JNI bridge-validation stub (app/src/main/cpp).
    // See variables.gradle's own Phase 10 comment for why r27d LTS was chosen.
    ndkVersion = rootProject.ext.ndkVersion
    defaultConfig {
        applicationId "com.apfctracker.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
        // Phase 10 — only arm64-v8a is built, matching the two real target devices (Snapdragon
        // 8 Gen 3, Snapdragon 870 — both 64-bit ARM) this and the following JARVIS phases target;
        // never armeabi-v7a/x86, which would only grow APK size for devices nothing here targets.
        ndk {
            abiFilters "arm64-v8a"
        }
        externalNativeBuild {
            cmake {
                cppFlags ""
            }
        }
    }
    // Phase 10 — builds ONLY the JNI bridge-validation stub (native_llama_bridge.cpp). llama.cpp
    // itself is not vendored/linked here — see CMakeLists.txt's own header.
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    // Matches capacitor.build.gradle's own (auto-generated, "DO NOT EDIT") compileOptions below —
    // Kotlin's JVM target must agree with the Java source/target compatibility Capacitor already sets.
    kotlinOptions {
        jvmTarget = "21"
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')

    // Phase 2 — native low-latency stylus ink (see this session's architecture report for why:
    // Repository document freehand writing remained poor on physical Android hardware even after
    // several rounds of JS/canvas-side optimization; MiniInkCanvas/web stayed smooth throughout).
    // All three are current STABLE releases (verified directly against developer.android.com on
    // the date this was written), not alphas/betas. All require minSdk 29 except
    // input-motionprediction, which only needs 21 but is used here alongside the other two.
    implementation "androidx.ink:ink-authoring:1.0.0"
    implementation "androidx.ink:ink-brush:1.0.0"
    implementation "androidx.ink:ink-geometry:1.0.0"
    implementation "androidx.ink:ink-rendering:1.0.0"
    implementation "androidx.ink:ink-strokes:1.0.0"
    implementation "androidx.graphics:graphics-core:1.0.4"
    implementation "androidx.input:input-motionprediction:1.0.0"
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
