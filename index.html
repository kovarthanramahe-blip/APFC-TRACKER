<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1" />
    <meta name="theme-color" content="#1c2d9c" />
    <meta name="description" content="APFC Tracker — a complete preparation companion for the UPSC EPFO Assistant Provident Fund Commissioner exam: syllabus tracker, previous year style question bank, mock tests, notes and a Pomodoro study timer." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="APFC Tracker" />
    <title>APFC Tracker — UPSC EPFO Exam Prep</title>
    <style>
      /* First-load splash — plain inline CSS, not Tailwind, so it paints before any JS (and
         before Tailwind's own stylesheet) has loaded or run. React's createRoot(...).render()
         replaces #root's entire innerHTML on mount, so this markup needs no cleanup/removal code
         of its own — it simply stops existing once the real app paints over it. */
      #initial-splash {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        height: 100vh;
        background: #f8f7f2;
        color: #1c2d9c;
        font-family: system-ui, sans-serif;
      }
      #initial-splash-spinner {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        border: 3px solid rgba(28, 45, 156, 0.2);
        border-top-color: #1c2d9c;
        animation: initial-splash-spin 0.8s linear infinite;
      }
      @media (prefers-color-scheme: dark) {
        #initial-splash {
          background: #0b1230;
          color: #8caefb;
        }
        #initial-splash-spinner {
          border-color: rgba(140, 174, 251, 0.25);
          border-top-color: #8caefb;
        }
      }
      @keyframes initial-splash-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="initial-splash">
        <div id="initial-splash-spinner"></div>
        <span>Loading APFC Tracker…</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
